<!doctype html>
<html>
<head>
    <meta charset="utf-8">
    <title>WebRemote for Inibuilds A350</title>
    <link rel="stylesheet" href="main.css" type="text/css"/>
    <script type="text/javascript" src="libs/jquery.min.js"></script>
    <script type="text/javascript" src="libs/jquery-ui/jquery-ui.min.js"></script>
    <script type="text/javascript" src="main.js"></script>
</head>
<body>

<div id="connectionPanel">
    <input id="socketURL" type="text" value="ws://localhost:2048/fsuipc/"/>
    <input type="checkbox" id="autoconnect"/>
</div>

<div id="sh_fcu" class="shield" data-title="FCU" data-width="600">
    <div class="shieldGroup">
        <div class="label">SPD</div>
        <span class="lvar_value_indicator ledValue" data-lvarname="INI_AIRSPEED_DIAL" data-calculatorcommands="$$$ (>L:INI_AIRSPEED_DIAL)"></span>
        <div class="pushPullGroup">
            <button class="calculator_button" data-calculatorcommands="1 (>L:INI_FCU_MANAGED_SPEED_BUTTON)">manage</button>
            <button class="calculator_button" data-calculatorcommands="1 (>L:INI_FCU_SELECTED_SPEED_BUTTON)">pull</button>
        </div>
    </div>
    </div>

<div id="sh_fcub" class="shield" data-title="Autoflight" data-width="240">
    <div class="shieldGroup">
        <button class="lvar_status_indicator calculator_button" data-lvarname="INI_AP1_BUTTON" data-highlightvalue="1" data-calculatorcommands="1 (>L:INI_AP1_BUTTON)">AP1</button>
        <button class="lvar_status_indicator calculator_button" data-lvarname="AP8_BUTTON" data-highlightvalue="1" data-calculatorcommands="1 (>L:AP8_BUTTON)">A/THR</button>
    </div>
</div>

<div id="sh_rad" class="shield" data-title="Radio" data-width="345">
    <div class="shieldGroup">
        <div class="label">VHF 1</div>
        <span class="offset_value_indicator ledValue" data-offsetaddress="0x05C4" data-offsettype="uint" data-offsetsize="4" data-isvhf="1"></span>
        <button class="calculator_button" data-calculatorcommands="1 (>L:RMP_CPT_LSK_1_KEY)">⇔</button>
    </div>
</div>

<div id="sh_apu" class="shield" data-title="APU" data-width="170">
    <div class="shieldGroup">
        <div class="pb lvar_status_indicator calculator_button" data-lvarname="INI_APU_MASTER_SWITCH" data-calculatorcommands="1 (>L:INI_APU_MASTER_SWITCH)">MASTER</div>
        <div class="pb lvar_status_indicator calculator_button" data-lvarname="INI_APU_START_BUTTON" data-calculatorcommands="1 (>L:INI_APU_START_BUTTON)">START</div>
    </div>
</div>

</body>
</html>
